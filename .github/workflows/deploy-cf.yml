name: Deploy to Cloudflare Pages

# 触发条件:
#   1. push 到 main —— 上游有真更新被 sync 合并、或手动 Sync fork、或自己改代码 push 后自动部署
#   2. 手动触发(仓库 Actions 页面点 Run workflow)
# 说明:上游没有新提交时,sync 不会产生实际 push,因此不会触发本 workflow → 不会空跑重部署
on:
  push:
    branches: [main]
    # 仅运行相关文件变化才部署,避免 README/文档等无关改动触发
    paths:
      - "_worker.js"
      - "_headers"
      - "_redirects"
      - "_routes.json"
      - ".github/workflows/deploy-cf.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy _worker.js to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 组装 Pages 部署目录(只含运行所需文件)
        run: |
          rm -rf dist
          mkdir -p dist
          cp _worker.js dist/
          # 一并带上若存在的 Pages 辅助文件
          for f in _headers _redirects _routes.json; do
            if [ -f "$f" ]; then cp "$f" dist/; fi
          done
          echo "--- dist 内容 ---"
          ls -la dist

      - name: 部署到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=proxy --branch=main
